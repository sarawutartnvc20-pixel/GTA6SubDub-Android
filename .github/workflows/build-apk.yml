name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build pkg-config protobuf-compiler python3-protobuf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Clone chiaki-ng native library
        run: |
          mkdir -p third_party
          git clone --depth 1 --recursive https://github.com/streetpea/chiaki-ng.git third_party/chiaki-ng
          mkdir -p app/src/main/java/com/metallic/chiaki/lib
          cp third_party/chiaki-ng/android/app/src/main/java/com/metallic/chiaki/lib/Chiaki.kt app/src/main/java/com/metallic/chiaki/lib/Chiaki.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk GTA6SubDub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA6SubDub-apk
          path: GTA6SubDub.apk
          retention-days: 30
